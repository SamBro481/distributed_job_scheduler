services:

  api:
    build: .
    container_name: job_scheduler_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  redis:
    image: redis:7
    container_name: job_scheduler_redis

  scheduler:
    build: .
    container_name: job_scheduler_scheduler
    env_file:
      - .env
    depends_on:
      - redis
    command: python -u -m app.scheduler.scheduler

  worker:
    build: .
    container_name: job_scheduler_worker
    env_file:
      - .env
    depends_on:
      - redis
    command: python -u -m app.workers.worker